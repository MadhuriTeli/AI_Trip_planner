[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MadhuriTeli", email = "madhuriteli07@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-community[places]>=5.0.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
ai-trip-planner = "ai_trip_planner:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
